<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Hostal Doña Aurora</title>
    <style>
        :root {
            --banner-gradient: linear-gradient(135deg, #0f2537 0%, #1b3b6f 100%);
            --btn-action: #1b3b6f;
            --th-bg: #e8f1f5;
            --th-text: #0f2537;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --border-color: #d1e1e9;
            --text-dark: #1f2937;
            --badge-green: #e0f2fe;
            --badge-green-text: #0369a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 980px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(27, 59, 111, 0.1);
        }

        .banner {
            background: var(--banner-gradient);
            color: white;
            padding: 20px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
        }

        .company-logo {
            max-width: 280px;
            height: auto;
            max-height: 80px;
            object-fit: contain;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .search-container input {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            outline: none;
            width: 100%;
            max-width: 250px;
        }

        .date-display {
            font-size: 0.85em;
            font-weight: 600;
            background: var(--th-bg);
            padding: 6px 12px;
            border-radius: 15px;
        }

        .status-banner {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: var(--badge-green);
            color: var(--badge-green-text);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8em;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 55vh;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--th-bg);
            color: var(--th-text);
            padding: 10px;
            position: sticky;
            top: 0;
            font-size: 0.9em;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        td.prod-name { text-align: left; padding-left: 12px; font-weight: 600; }

        input[type="number"] {
            width: 70px;
            padding: 5px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .btn-enviar {
            background: var(--btn-action);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-enviar:disabled { background: #cbd5e1; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="banner">
        <img src="https://lh3.googleusercontent.com/d/1prUXBfN44PWRGggwhEJAgQeltmvMS33k" alt="Logo" class="company-logo">
        <button class="logout-btn" onclick="location.reload()">🔒 Salir</button>
    </div>

    <div class="toolbar">
        <div class="search-container">
            <input type="text" id="search" placeholder="Buscar producto..." oninput="filtrarProductos()">
        </div>
        <div class="date-display">📅 <span id="fecha-hoy">--/--</span></div>
    </div>

    <div class="status-banner">
        <div><strong>Vista:</strong> <span id="status-text">Cargando...</span></div>
        <div id="status-badge" class="badge">--</div>
    </div>

    <div class="table-wrapper">
        <table id="main-table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="2">Cargando lista de productos...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer-bar">
        <div>Total productos: <strong id="stat-total">0</strong></div>
        <button id="btn-send" class="btn-enviar" onclick="enviar()">Enviar a Sheets ↑</button>
    </div>
</div>

<script>
    // URL de tu Web App de Google Apps Script
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycby8w7J0bwtXVnGXrRfmlk2Kq-VrhW1Ur5-I8iFnQbgfcmX6GXbQ75wQdyhtBSmmYhQ/exec";

    let productos = [];
    let vistaActual = "matutina";

    document.addEventListener("DOMContentLoaded", () => {
        inicializar();
    });

    async function inicializar() {
        try {
            const resEstado = await fetch(`${URL_SCRIPT}?action=obtenerEstado`);
            const estado = await resEstado.json();
            
            if (estado.fecha) {
                document.getElementById("fecha-hoy").innerText = estado.fecha;
            }

            document.getElementById("status-text").innerText = "Captura Matutina";
            document.getElementById("status-badge").innerText = "Turno Mañana";

            await cargarProductos();
        } catch (e) {
            console.error("Error al inicializar:", e);
            document.getElementById("tbody").innerHTML = `<tr><td colspan="2" style="color:red;">Error de conexión con la base de datos.</td></tr>`;
        }
    }

    async function cargarProductos() {
        try {
            const res = await fetch(`${URL_SCRIPT}?action=obtenerProductos&vista=${vistaActual}`);
            const data = await res.json();

            if (Array.isArray(data)) {
                productos = data;
                renderizarTabla(productos);
            } else {
                alert("Error al cargar productos: " + (data.message || "Respuesta inválida"));
                document.getElementById("tbody").innerHTML = `<tr><td colspan="2" style="color:red;">Error al cargar la lista.</td></tr>`;
            }
        } catch (e) {
            console.error("Error obteniendo productos:", e);
            alert("Ocurrió un error al cargar la lista de productos.");
        }
    }

    function renderizarTabla(lista) {
        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";

        document.getElementById("stat-total").innerText = lista.length;

        if (lista.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2">No se encontraron productos.</td></tr>`;
            return;
        }

        lista.forEach((p, idx) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td class="prod-name">${p.nombre}</td>
                <td>
                    <input type="number" min="0" id="input-${idx}" placeholder="0">
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filtrarProductos() {
        const q = document.getElementById("search").value.toLowerCase().trim();
        const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(q));
        renderizarTabla(filtrados);
    }

    async function enviar() {
        const btnSend = document.getElementById("btn-send");
        btnSend.disabled = true;
        btnSend.innerText = "Enviando...";

        const datosEnviar = productos.map((p, idx) => {
            const el = document.getElementById(`input-${idx}`);
            return {
                nombre: p.nombre,
                valor: el ? parseFloat(el.value) || 0 : 0
            };
        });

        try {
            const res = await fetch(URL_SCRIPT, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "guardarCaptura",
                    vista: vistaActual,
                    datos: datosEnviar
                })
            });

            const result = await res.json();
            if (result.status === "success") {
                alert("¡Datos guardados correctamente!");
                location.reload();
            } else {
                alert("Error al guardar: " + result.message);
            }
        } catch (e) {
            console.error("Error al enviar:", e);
            alert("Error de conexión al enviar los datos.");
        } finally {
            btnSend.disabled = false;
            btnSend.innerText = "Enviar a Sheets ↑";
        }
    }
</script>
</body>
</html>
