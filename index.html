<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Hostal Doña Aurora</title>
    <style>
        :root {
            --banner-gradient: linear-gradient(135deg, #0f2537 0%, #1b3b6f 100%);
            --btn-action: #1b3b6f;
            --btn-action-hover: #0f2537;
            --accent-gold: #d4af37;
            --th-bg: #e8f1f5;
            --th-text: #0f2537;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --border-color: #d1e1e9;
            --text-dark: #1f2937;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 980px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(27, 59, 111, 0.1);
        }

        .banner {
            background: var(--banner-gradient);
            color: white;
            padding: 24px 20px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
        }

        .banner-logo-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .company-logo {
            width: 100%;
            max-width: 380px;
            height: auto;
            max-height: 140px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.3));
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 0.8em;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            position: absolute;
            right: 20px;
            top: 20px;
            font-weight: 600;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .search-container { position: relative; flex: 1; min-width: 200px; }
        .search-container input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background-color: #f8fafc;
            font-size: 0.9em;
            outline: none;
        }

        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; }

        .date-display {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--th-text);
            background: var(--th-bg);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82em;
            font-weight: 600;
            color: var(--th-text);
        }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #94a3b8; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--btn-action); }
        input:checked + .slider:before { transform: translateX(20px); }

        .status-banner {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 0.88em;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge-active { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 8px; font-weight: 700; }
        .badge-blocked { background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 8px; font-weight: 700; }

        .extra-btn {
            background: #f59e0b; color: white; border: none; padding: 6px 12px;
            border-radius: 12px; font-size: 0.8em; font-weight: 700; cursor: pointer;
        }

        .content-card {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            background: #fff;
        }

        .table-wrapper { overflow-x: auto; max-height: 55vh; border-radius: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 4px 6px; }
        th { background: var(--th-bg); color: var(--th-text); padding: 10px; font-size: 0.85em; font-weight: 700; position: sticky; top: 0; }
        td { padding: 8px; font-size: 0.88em; text-align: center; background: #f8fafc; border-radius: 6px; }
        td.prod-name { text-align: left; font-weight: 600; padding-left: 12px; }

        input[type="number"] {
            width: 75px; padding: 6px 4px; text-align: center; font-size: 0.9em;
            border: 1px solid var(--border-color); border-radius: 8px; outline: none;
        }

        .message-box { text-align: center; padding: 40px 20px; color: #64748b; font-weight: 600; }

        .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
        .btn-enviar {
            background: var(--btn-action); color: white; border: none; padding: 12px 24px;
            border-radius: 25px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 12px rgba(27, 59, 111, 0.2);
        }
        .btn-enviar:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="banner">
        <div class="banner-logo-container">
            <img src="https://lh3.googleusercontent.com/d/1prUXBfN44PWRGggwhEJAgQeltmvMS33k" alt="Logo Hostal Doña Aurora" class="company-logo">
        </div>
        <button class="logout-btn" onclick="location.reload()">🔒 Salir</button>
    </div>

    <div class="toolbar">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="Buscar producto..." oninput="filtrarProductos()">
        </div>

        <div class="date-display">
            📅 <span id="fecha-hoy">-- --- ----</span>
        </div>

        <button id="btn-modo-compra" class="extra-btn" style="background:#10b981;" onclick="activarModoCompra()">➕ Registrar Compras</button>

        <div class="toggle-container">
            <span>Admin</span>
            <label class="switch">
                <input type="checkbox" id="mode-toggle" onchange="toggleModoSwitch()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="status-banner">
        <div><strong>Vista:</strong> <span id="status-text">Cargando...</span></div>
        <div style="display:flex; gap:8px; align-items:center;">
            <button id="btn-extra" class="extra-btn" style="display:none;" onclick="abrirHorarioExtraordinario()">🔓 Horario Extra</button>
            <div id="status-badge" class="badge-active">--</div>
        </div>
    </div>

    <div class="content-card">
        <div class="table-wrapper">
            <table id="main-table">
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
            </table>
            <div id="msg-blocked" class="message-box" style="display:none;"></div>
        </div>
    </div>

    <div class="footer-bar">
        <div>Total productos: <strong id="stat-total">0</strong></div>
        <button id="btn-send" class="btn-enviar" onclick="enviar()">Enviar a Sheets ↑</button>
    </div>
</div>

<script>
    const URL_GAS = "https://script.google.com/macros/s/AKfycbxqkCtLlWWyQEkCy7zbMoYQYNlVpQXsvSI_xSI_YgUqd3VQvNg6MFGX3hBXHQtf2RF0/exec";
    const CLAVE = "2026";
    const CLAVE_COMPRAS = "2710"; // PIN asignado a Alejandra Paredes

    let isAdmin = false;
    let horarioExtraordinario = false;
    let modoCompra = false;

    let capturaMatutinaRealizada = localStorage.getItem('capturaMatutina') === 'true';
    let capturaVespertinaRealizada = localStorage.getItem('capturaVespertina') === 'true';
    let capturaFisicaRealizada = localStorage.getItem('capturaFisica') === 'true';

    const listaNombres = [
        "AGUA 1 1/2", "AGUA GALON", "AGUA 1 1/2 SABOR", "ALCOHOL",
        "BOING 1/2", "BUSCAPINA", "CEPILLO DENTAL", "CORTA UÑAS",
        "CIGARROS", "CONDON", "COTONETES", "CREMA HINDS",
        "DESODORANTE HOMBRE", "DESODORANTE MUJER", "ENCENDEDOR",
        "GEL CHICO", "GEL GRANDE", "IBUPROFENO", "JABON PALMOLIVE",
        "JABON ZEST", "JARRITO 2 LITROS", "LORATAINA", "PALOMITAS",
        "PAPEL HIGIENICO", "PARACETAMOL", "PASTA COLGATE",
        "PASTA LUMINUS WHITE", "PEPTO BISMOL", "POMADA LABIOS",
        "RASTRILLO 2 HOJAS", "RASTRILLO 3 HOJAS", "RED COLA 2 LTS",
        "RITZ", "ROSEL", "SAL DE UVAS PICOT", "SEDALMERK",
        "SHAMPOO CAPRICE", "SHAMPOO PALMOLIVE", "SHAMPOO PANTENE",
        "SHAMPOO H & SH", "SOPA MARUCHAN", "SUERO ELECTROLIT", "TALCO", 
        "TOALLA FEMENINA", "TOALLA FEM NOCTURNA", "ZACATE CHICO", "ZACATE GRANDE",
        "CABLE TIPO C", "CUBO TIPO C", "CABLE IPHONE",
        "CARGADOR DE IPHONE", "PANTENE G", "COLGATE G"
    ];

    let productos = listaNombres.map(nombre => ({
        n: nombre, s: '', c: '', vMat: '', vNoc: '', vTotal: 0, f: ''
    }));

    function CargarFecha() {
        const opciones = { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'America/Mexico_City' };
        document.getElementById('fecha-hoy').innerText = new Date().toLocaleDateString('es-MX', opciones).toUpperCase();
    }

    function activarModoCompra() {
        if (!modoCompra) {
            const pass = prompt("Acceso a Compras (Alejandra Paredes) - Ingrese PIN:");
            if (pass === CLAVE_COMPRAS) {
                modoCompra = true;
                const btn = document.getElementById('btn-modo-compra');
                btn.style.background = "#ef4444";
                btn.innerText = "✖ Cancelar Compras";
                render();
            } else if (pass !== null && pass !== "") {
                alert("🔒 PIN incorrecto. Acceso denegado.");
            }
        } else {
            modoCompra = false;
            const btn = document.getElementById('btn-modo-compra');
            btn.style.background = "#10b981";
            btn.innerText = "➕ Registrar Compras";
            render();
        }
    }

    function obtenerFaseActual() {
        if (modoCompra) return "COMPRA";
        if (isAdmin) return "ADMIN";
        if (horarioExtraordinario) return "HORARIO_EXTRAORDINARIO";

        // Obtención estricta de hora y minuto local de México (CDMX)
        const cdmxDateStr = new Date().toLocaleString("en-US", { timeZone: "America/Mexico_City" });
        const cdmxDate = new Date(cdmxDateStr);
        const mins = cdmxDate.getHours() * 60 + cdmxDate.getMinutes();

        // 1. Conteo físico final si ya se completaron ambas ventas
        if (capturaMatutinaRealizada && capturaVespertinaRealizada) {
            return "CONTEO_FISICO";
        }

        // 2. Turno Matutino: Disponible de 18:00 a 18:30 (1080 a 1110 minutos)
        if (mins >= 18 * 60 && mins < 18 * 60 + 30) {
            return capturaMatutinaRealizada ? "CONTEO_FISICO" : "VENTA_MATUTINA";
        }

        // 3. Turno Vespertino: Disponible de 06:00 a 06:30 (360 a 390 minutos)
        if (mins >= 6 * 60 && mins < 6 * 60 + 30) {
            return capturaMatutinaRealizada ? "VENTA_VESPERTINA" : "BLOQUEADO_MATUTINA_PENDIENTE";
        }

        return "BLOQUEADO_FUERA_DE_HORARIO";
    }

    async function toggleModoSwitch() {
        const toggle = document.getElementById('mode-toggle');
        if (toggle.checked) {
            const pass = prompt("Clave Admin:");
            if (pass === CLAVE) {
                isAdmin = true;
                modoCompra = false;
                await cargarEstadoServidor();
            } else {
                alert("Clave incorrecta");
                toggle.checked = false;
                isAdmin = false;
            }
        } else {
            isAdmin = false;
            horarioExtraordinario = false;
            productos.forEach(p => {
                p.s = ''; p.c = ''; p.vMat = ''; p.vNoc = ''; p.vTotal = 0; p.f = '';
            });
        }
        render();
    }

    function abrirHorarioExtraordinario() {
        const pass = prompt("Ingrese clave Admin para abrir Horario Extraordinario:");
        if (pass === CLAVE) {
            horarioExtraordinario = true;
            alert("🔓 Horario extraordinario activado.");
            cargarEstadoServidor();
        } else {
            alert("Clave incorrecta.");
        }
    }

    function validarEntrada(input, i, campo) {
        if (input.value.includes('-')) {
            input.value = input.value.replace(/-/g, '');
        }

        let val = parseInt(input.value);
        if (isNaN(val) || val < 0) {
            input.value = '';
            productos[i][campo] = '';
        } else {
            productos[i][campo] = val;
        }

        let vMat = parseInt(productos[i].vMat) || 0;
        let vNoc = parseInt(productos[i].vNoc) || 0;
        productos[i].vTotal = vMat + vNoc;
    }

    function render() {
        const fase = obtenerFaseActual();
        const thead = document.getElementById('thead');
        const statusText = document.getElementById('status-text');
        const statusBadge = document.getElementById('status-badge');
        const btnSend = document.getElementById('btn-send');
        const btnExtra = document.getElementById('btn-extra');
        const mainTable = document.getElementById('main-table');
        const msgBlocked = document.getElementById('msg-blocked');

        mainTable.style.display = "table";
        msgBlocked.style.display = "none";
        btnSend.disabled = false;
        btnExtra.style.display = "none";

        if (fase === "COMPRA") {
            statusText.innerText = "Modo Registro de Compras (Alejandra Paredes)";
            statusBadge.innerText = "COMPRAS";
            statusBadge.className = "badge-active";
            thead.innerHTML = "<tr><th>Producto</th><th>Cantidad Comprada</th></tr>";
        }
        else if (fase === "ADMIN" || fase === "HORARIO_EXTRAORDINARIO") {
            statusText.innerText = fase === "ADMIN" ? "Modo Administración - Consulta y Edición de BD" : "Edición bajo Horario Extraordinario";
            statusBadge.innerText = "ADMIN";
            statusBadge.className = "badge-active";
            thead.innerHTML = "<tr><th>Producto</th><th>Inicial</th><th>+Compra</th><th>-V. Mat</th><th>-V. Ves</th><th>Total V.</th><th>Físico</th></tr>";
        } 
        else if (fase === "VENTA_MATUTINA") {
            statusText.innerText = "Captura Venta Matutina (Disponible: 18:00 - 18:30 hrs)";
            statusBadge.innerText = "VENTA MATUTINA";
            statusBadge.className = "badge-active";
            thead.innerHTML = "<tr><th>Producto</th><th>Ventas Turno Matutino</th></tr>";
        } 
        else if (fase === "VENTA_VESPERTINA") {
            statusText.innerText = "Captura Venta Vespertina (Disponible: 06:00 - 06:30 hrs)";
            statusBadge.innerText = "VENTA VESPERTINA";
            statusBadge.className = "badge-active";
            thead.innerHTML = "<tr><th>Producto</th><th>Ventas Turno Vespertino</th></tr>";
        } 
        else if (fase === "CONTEO_FISICO") {
            statusText.innerText = "Captura de Inventario Físico Final (A ciegas)";
            statusBadge.innerText = "CONTEO FÍSICO";
            statusBadge.className = "badge-active";
            thead.innerHTML = "<tr><th>Producto</th><th>Conteo Físico Final</th></tr>";
        } 
        else if (fase === "BLOQUEADO_MATUTINA_PENDIENTE") {
            statusText.innerText = "Captura bloqueada";
            statusBadge.innerText = "MATUTINO PENDIENTE";
            statusBadge.className = "badge-blocked";
            mainTable.style.display = "none";
            msgBlocked.style.display = "block";
            msgBlocked.innerHTML = "⚠️ <strong>No se puede capturar el turno vespertino.</strong><br>La venta del turno matutino no fue realizada previa al corte.<br>Pida apoyo a Admin para abrir un horario extraordinario.";
            btnSend.disabled = true;
            btnExtra.style.display = "inline-block";
        } 
        else if (fase === "BLOQUEADO_FUERA_DE_HORARIO") {
            statusText.innerText = "Captura fuera de horario de corte";
            statusBadge.innerText = "FUERA DE HORARIO";
            statusBadge.className = "badge-blocked";
            mainTable.style.display = "none";
            msgBlocked.style.display = "block";
            msgBlocked.innerHTML = "⏰ <strong>Sistema Bloqueado.</strong><br>Horarios de corte:<br>- Venta Matutina: 18:00 a 18:30 hrs<br>- Venta Vespertina: 06:00 a 06:30 hrs<br><em>Usa '➕ Registrar Compras' para ingresar productos comprados en cualquier momento.</em>";
            btnSend.disabled = true;
            btnExtra.style.display = "inline-block";
        }

        filtrarProductos();
    }

    function filtrarProductos() {
        const tbody = document.getElementById('tbody');
        const query = document.getElementById('search').value.toLowerCase();
        const fase = obtenerFaseActual();
        tbody.innerHTML = "";

        productos.forEach((p, i) => {
            if (p.n.toLowerCase().includes(query)) {
                let row = tbody.insertRow();
                
                if (fase === "COMPRA") {
                    row.innerHTML = `
                        <td class="prod-name">${p.n}</td>
                        <td><input type="number" value="${p.c}" placeholder="0" min="0" step="1" oninput="validarEntrada(this, ${i}, 'c')"></td>`;
                } else if (fase === "ADMIN" || fase === "HORARIO_EXTRAORDINARIO") {
                    row.innerHTML = `
                        <td class="prod-name">${p.n}</td>
                        <td><input type="number" value="${p.s}" placeholder="0" min="0" oninput="validarEntrada(this, ${i}, 's')"></td>
                        <td><input type="number" value="${p.c}" placeholder="0" min="0" oninput="validarEntrada(this, ${i}, 'c')"></td>
                        <td><input type="number" value="${p.vMat}" placeholder="0" min="0" oninput="validarEntrada(this, ${i}, 'vMat')"></td>
                        <td><input type="number" value="${p.vNoc}" placeholder="0" min="0" oninput="validarEntrada(this, ${i}, 'vNoc')"></td>
                        <td><strong>${p.vTotal}</strong></td>
                        <td><input type="number" value="${p.f}" placeholder="0" min="0" oninput="validarEntrada(this, ${i}, 'f')"></td>`;
                } else if (fase === "VENTA_MATUTINA") {
                    row.innerHTML = `
                        <td class="prod-name">${p.n}</td>
                        <td><input type="number" value="${p.vMat}" placeholder="0" min="0" step="1" oninput="validarEntrada(this, ${i}, 'vMat')"></td>`;
                } else if (fase === "VENTA_VESPERTINA") {
                    row.innerHTML = `
                        <td class="prod-name">${p.n}</td>
                        <td><input type="number" value="${p.vNoc}" placeholder="0" min="0" step="1" oninput="validarEntrada(this, ${i}, 'vNoc')"></td>`;
                } else if (fase === "CONTEO_FISICO") {
                    row.innerHTML = `
                        <td class="prod-name">${p.n}</td>
                        <td><input type="number" value="${p.f}" placeholder="0" min="0" step="1" oninput="validarEntrada(this, ${i}, 'f')"></td>`;
                }
            }
        });
        document.getElementById('stat-total').innerText = productos.length;
    }

    async function cargarEstadoServidor() {
        try {
            const res = await fetch(URL_GAS);
            const data = await res.json();
            if (data) {
                if (typeof data.matutinaCapturada !== 'undefined') {
                    capturaMatutinaRealizada = data.matutinaCapturada;
                    localStorage.setItem('capturaMatutina', capturaMatutinaRealizada);
                }
                if (typeof data.vespertinaCapturada !== 'undefined') {
                    capturaVespertinaRealizada = data.vespertinaCapturada;
                    localStorage.setItem('capturaVespertina', capturaVespertinaRealizada);
                }
                
                if (data.items && data.items.length > 0 && (isAdmin || horarioExtraordinario)) {
                    data.items.forEach(itemServidor => {
                        let localItem = productos.find(p => p.n === itemServidor.nombre);
                        if (localItem) {
                            localItem.s = itemServidor.inicial;
                            localItem.c = itemServidor.compra;
                            localItem.vMat = itemServidor.ventaMatutino;
                            localItem.vNoc = itemServidor.ventaNocturno;
                            localItem.vTotal = itemServidor.ventaTotal;
                            localItem.f = itemServidor.fisico;
                        }
                    });
                }
                render();
            }
        } catch (e) {
            render();
        }
    }

    async function enviar() {
        const btn = document.getElementById('btn-send');
        btn.disabled = true;
        btn.innerText = "Enviando... ⏳";

        const fase = obtenerFaseActual();

        if (fase === "VENTA_MATUTINA") {
            capturaMatutinaRealizada = true;
            localStorage.setItem('capturaMatutina', 'true');
        }
        if (fase === "VENTA_VESPERTINA") {
            capturaVespertinaRealizada = true;
            localStorage.setItem('capturaVespertina', 'true');
        }
        if (fase === "CONTEO_FISICO") {
            capturaFisicaRealizada = true;
            localStorage.setItem('capturaFisica', 'true');
        }

        const data = productos.map(p => ({
            rol: isAdmin ? "Admin" : (fase === "COMPRA" ? "Alejandra Paredes" : "Vendedor"),
            fase: fase,
            nombre: p.n,
            inicial: p.s !== '' ? p.s : 0,
            compra: p.c !== '' ? p.c : 0,
            ventaMatutino: p.vMat !== '' ? p.vMat : 0,
            ventaNocturno: p.vNoc !== '' ? p.vNoc : 0,
            fisico: p.f !== '' ? p.f : 0
        }));

        try {
            await fetch(URL_GAS, { 
                method: "POST", 
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(data) 
            });

            if (fase === "VENTA_MATUTINA") {
                alert("✅ ¡Captura enviada con éxito!\n\nMuchas gracias Sra. Liliana por realizar la captura del turno matutino.");
            } else if (fase === "VENTA_VESPERTINA") {
                alert("✅ ¡Captura enviada con éxito!\n\nMuchas gracias Sr. Alberto Melchor por realizar la captura del turno vespertino.");
            } else if (fase === "COMPRA") {
                alert("✅ ¡Compras registradas con éxito por Alejandra Paredes!");
            } else {
