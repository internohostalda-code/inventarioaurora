<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Hostal Doña Aurora</title>
    <style>
        :root {
            --banner-gradient: linear-gradient(135deg, #0f2537 0%, #1b3b6f 100%);
            --btn-action: #1b3b6f;
            --btn-action-hover: #0f2537;
            --accent-gold: #d4af37;
            --th-bg: #e8f1f5;
            --th-text: #0f2537;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --border-color: #d1e1e9;
            --text-dark: #1f2937;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 980px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(27, 59, 111, 0.1);
        }

        .banner {
            background: var(--banner-gradient);
            color: white;
            padding: 24px 20px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
        }

        .banner-logo-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .company-logo {
            width: 100%;
            max-width: 380px;
            height: auto;
            max-height: 140px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.3));
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 0.8em;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            position: absolute;
            right: 20px;
            top: 20px;
            font-weight: 600;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .search-container {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-container input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background-color: #f8fafc;
            font-size: 0.9em;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .date-display {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--th-text);
            background: var(--th-bg);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82em;
            font-weight: 600;
            color: var(--th-text);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #94a3b8;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--btn-action);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .status-banner {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 0.88em;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge-active {
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
        }

        .badge-blocked {
            background: #fee2e2;
            color: #991b1b;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
        }

        .extra-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 700;
            cursor: pointer;
        }

        .content-card {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            background: #fff;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 55vh;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 4px 6px;
        }

        th {
            background: var(--th-bg);
            color: var(--th-text);
            padding: 10px;
            font-size: 0.85em;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        td {
            padding: 8px;
            font-size: 0.88em;
            text-align: center;
            background: #f8fafc;
            border-radius: 6px;
        }

        td.prod-name {
            text-align: left;
            font-weight: 600;
            padding-left: 12px;
        }

        input[type="number"] {
            width: 75px;
            padding: 6px 4px;
            text-align: center;
            font-size: 0.9em;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }

        .message-box {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-weight: 600;
        }

        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .btn-enviar {
            background: var(--btn-action);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(27, 59, 111, 0.2);
        }

        .btn-enviar:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="banner">
        <div class="banner-logo-container">
            <img src="https://lh3.googleusercontent.com/d/1prUXBfN44PWRGggwhEJAgQeltmvMS33k" alt="Logo Hostal Doña Aurora" class="company-logo">
        </div>
        <button class="logout-btn" onclick="location.reload()">🔒 Salir</button>
    </div>

    <div class="toolbar">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="Buscar producto..." oninput="filtrarProductos()">
        </div>

        <div class="date-display">
            📅 <span id="fecha-hoy">-- --- ----</span>
        </div>

        <button id="btn-modo-compra" class="extra-btn" style="background:#10b981;" onclick="activarModoCompra()">➕ Registrar Compras</button>

        <div class="toggle-container">
            <span>Admin</span>
            <label class="switch">
                <input type="checkbox" id="mode-toggle" onchange="toggleModoSwitch()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="status-banner">
        <div><strong>Vista:</strong> <span id="status-text">Cargando...</span></div>
        <div style="display:flex; gap:8px; align-items:center;">
            <button id="btn-extra" class="extra-btn" style="display:none;" onclick="abrirHorarioExtraordinario()">🔓 Horario Extra</button>
            <div id="status-badge" class="badge-active">--</div>
        </div>
    </div>

    <div class="content-card">
        <div class="table-wrapper">
            <table id="main-table">
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
            </table>
            <div id="msg-blocked" class="message-box" style="display:none;"></div>
        </div>
    </div>

    <div class="footer-bar">
        <div>Total productos: <strong id="stat-total">0</strong></div>
        <button id="btn-send" class="btn-enviar" onclick="enviar()">Enviar a Sheets ↑</button>
    </div>
</div>

<script>
    // URL de Web App configurada con tu ID de Google Apps Script
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzwKULkPopfBu8bGZU0LKxQrermOlA6XY4StAObo4d5UjhlAr0mnIw-reHEPIJt4h_7/exec";

    let estadoSistema = {};
    let productos = [];
    let vistaActual = ""; // 'matutina', 'vespertina', 'conteo', 'compras'
    let esModoAdmin = false;

    document.addEventListener("DOMContentLoaded", function () {
        inicializarSistema();
    });

    async function inicializarSistema() {
        try {
            const res = await fetch(`${URL_SCRIPT}?action=obtenerEstado`);
            estadoSistema = await res.json();

            // Formatear fecha en cabecera
            if (estadoSistema.fecha) {
                document.getElementById("fecha-hoy").innerText = estadoSistema.fecha;
            } else {
                document.getElementById("fecha-hoy").innerText = new Date().toLocaleDateString("es-MX");
            }

            // Auto-limpieza automática de caché en navegador
            const fechaLocal = localStorage.getItem("fechaUltimaCaptura");
            const versionLocal = localStorage.getItem("versionApp");

            if (fechaLocal !== estadoSistema.fecha || versionLocal !== estadoSistema.versionApp) {
                localStorage.clear();
                localStorage.setItem("fechaUltimaCaptura", estadoSistema.fecha);
                localStorage.setItem("versionApp", estadoSistema.versionApp);
                console.log("Caché borrada automáticamente por actualización de versión o cambio de día.");
            }

            evaluarAccesoYSectores();
        } catch (err) {
            console.error("Error al conectar con Google Sheets:", err);
            mostrarMensajeBloqueo("No se pudo conectar con la base de datos. Verifica la conexión o los permisos de la Web App.");
        }
    }

    function evaluarAccesoYSectores() {
        const ahora = new Date();
        const horaActual = ahora.getHours() + (ahora.getMinutes() / 60);

        // Ventanas de captura: Matutino (06:00 - 06:30) | Vespertino (18:00 - 18:30)
        const esHorarioMatutino = horaActual >= 6.0 && horaActual <= 6.5;
        const esHorarioVespertino = horaActual >= 18.0 && horaActual <= 18.5;

        const matutinaLista = localStorage.getItem("capturaMatutina") === "true" || estadoSistema.capturaMatutina;
        const vespertinaLista = localStorage.getItem("capturaVespertina") === "true" || estadoSistema.capturaVespertina;

        // REGLA 1: Bloqueo si el inventario final ya se cerró
        if (estadoSistema.inventarioCerrado && !esModoAdmin) {
            mostrarMensajeBloqueo("El inventario final ya ha sido capturado y cerrado. Se abrirá hasta el siguiente turno.");
            return;
        }

        // REGLA 2: Abrir Conteo Físico SI Y SOLO SI están capturados ambos turnos
        if (matutinaLista && vespertinaLista) {
            cargarVista("conteo");
            return;
        }

        // REGLA 3: Evaluación de turnos y horarios de captura
        if (!matutinaLista) {
            if (esHorarioMatutino || esModoAdmin) {
                cargarVista("matutina");
            } else {
                mostrarMensajeBloqueo("Fuera de horario. La captura matutina se habilita de 06:00 a 06:30 hrs.");
                document.getElementById("btn-extra").style.display = "inline-block";
            }
        } else if (!vespertinaLista) {
            if (esHorarioVespertino || esModoAdmin) {
                cargarVista("vespertina");
            } else {
                mostrarMensajeBloqueo("Fuera de horario. La captura vespertina se habilita de 18:00 a 18:30 hrs.");
                document.getElementById("btn-extra").style.display = "inline-block";
            }
        }
    }

    async function cargarVista(modo) {
        vistaActual = modo;
        ocultarBloqueo();

        const badge = document.getElementById("status-badge");
        const statusText = document.getElementById("status-text");

        if (modo === "matutina") {
            statusText.innerText = "Captura Matutina (Entradas/Salidas)";
            badge.innerText = "Turno Mañana";
            badge.className = "badge-active";
        } else if (modo === "vespertina") {
            statusText.innerText = "Captura Vespertina (Entradas/Salidas)";
            badge.innerText = "Turno Tarde";
            badge.className = "badge-active";
        } else if (modo === "conteo") {
            statusText.innerText = "Conteo Físico Final";
            badge.innerText = "Cierre de Inventario";
            badge.className = "badge-active";
        } else if (modo === "compras") {
            statusText.innerText = "Registro Extraordinario de Compras";
            badge.innerText = "Modo Compras";
            badge.className = "badge-active";
        }

        try {
            const res = await fetch(`${URL_SCRIPT}?action=obtenerProductos&vista=${modo}`);
            productos = await res.json();
            renderizarTabla(productos);
        } catch (e) {
            console.error("Error al obtener los productos:", e);
            alert("Ocurrió un error al cargar la lista de productos.");
        }
    }

    function renderizarTabla(lista) {
        const thead = document.getElementById("thead");
        const tbody = document.getElementById("tbody");

        thead.innerHTML = "";
        tbody.innerHTML = "";

        document.getElementById("stat-total").innerText = lista.length;

        if (vistaActual === "conteo") {
            thead.innerHTML = `
                <tr>
                    <th>Producto</th>
                    <th>Teórico</th>
                    <th>Conteo Físico</th>
                </tr>
            `;

            lista.forEach((p, idx) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="prod-name">${p.nombre}</td>
                    <td>${p.teorico !== undefined ? p.teorico : 0}</td>
                    <td>
                        <input type="number" min="0" id="input-${idx}" value="${p.fisico !== undefined ? p.fisico : ''}" placeholder="0">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            thead.innerHTML = `
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                </tr>
            `;

            lista.forEach((p, idx) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="prod-name">${p.nombre}</td>
                    <td>
                        <input type="number" min="0" id="input-${idx}" value="${p.cantidad !== undefined ? p.cantidad : ''}" placeholder="0">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    }

    function filtrarProductos() {
        const query = document.getElementById("search").value.toLowerCase().trim();
        const productosFiltrados = productos.filter(p => p.nombre.toLowerCase().includes(query));
        renderizarTabla(productosFiltrados);
    }

    function toggleModoSwitch() {
        esModoAdmin = document.getElementById("mode-toggle").checked;
        evaluarAccesoYSectores();
    }

    function activarModoCompra() {
        cargarVista("compras");
    }

    function abrirHorarioExtraordinario() {
        const clave = prompt("Ingresa la clave de autorización para habilitar horario extraordinario:");
        if (clave === "1234") {
            esModoAdmin = true;
            document.getElementById("mode-toggle").checked = true;
            evaluarAccesoYSectores();
        } else if (clave !== null) {
            alert("Clave de autorización incorrecta.");
        }
    }

    async function enviar() {
        const btnSend = document.getElementById("btn-send");
        btnSend.disabled = true;
        btnSend.innerText = "Enviando a Sheets...";

        const datosEnviar = productos.map((p, idx) => {
            const inputEl = document.getElementById(`input-${idx}`);
            const valor = inputEl ? parseFloat(inputEl.value) || 0 : 0;
            return {
                id: p.id || p.nombre,
                nombre: p.nombre,
                valor: valor
            };
        });

        try {
            const response = await fetch(URL_SCRIPT, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    action: "guardarCaptura",
                    vista: vistaActual,
                    datos: datosEnviar
                })
            });

            const res = await response.json();

            if (res.status === "success") {
                alert("¡Datos guardados correctamente en Google Sheets!");
                if (vistaActual === "matutina") {
                    localStorage.setItem("capturaMatutina", "true");
                } else if (vistaActual === "vespertina") {
                    localStorage.setItem("capturaVespertina", "true");
                }
                location.reload();
            } else {
                alert("Error al guardar en Sheets: " + res.message);
            }
        } catch (e) {
            console.error("Error al enviar la información:", e);
            alert("Ocurrió un error de conexión al enviar los datos.");
        } finally {
            btnSend.disabled = false;
            btnSend.innerText = "Enviar a Sheets ↑";
        }
    }

    function mostrarMensajeBloqueo(texto) {
        document.getElementById("main-table").style.display = "none";
        const msg = document.getElementById("msg-blocked");
        msg.style.display = "block";
        msg.innerText = texto;

        document.getElementById("status-text").innerText = "Acceso Restringido";
        const badge = document.getElementById("status-badge");
        badge.innerText = "Bloqueado";
        badge.className = "badge-blocked";
        document.getElementById("btn-send").style.display = "none";
    }

    function ocultarBloqueo() {
        document.getElementById("main-table").style.display = "table";
        document.getElementById("msg-blocked").style.display = "none";
        document.getElementById("btn-send").style.display = "block";
        document.getElementById("btn-extra").style.display = "none";
    }
</script>
</body>
</html>
